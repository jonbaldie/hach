name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        ghc: ["9.12.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ matrix.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ matrix.os }}-ghc-${{ matrix.ghc }}-cabal-

      - name: Build
        run: |
          cabal update
          cabal build all

      - name: Run Tests
        run: cabal test hach:test:hach-test --test-show-details=always

      - name: Public CLI permission-outcome regression
        run: python3 scripts/repro-288.py "$(cabal list-bin exe:hach)"

      - name: Public CLI interaction-permission regression
        run: python3 scripts/repro-191.py "$(cabal list-bin exe:hach)"

      - name: Stage Linux CLI for independent verification
        if: matrix.os == 'ubuntu-latest'
        run: cp "$(cabal list-bin exe:hach)" "$RUNNER_TEMP/hach"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: hach-linux-ci
          path: ${{ runner.temp }}/hach
          retention-days: 1
