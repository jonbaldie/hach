name: Verify release ARM64 (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin_arm64
            ghc: "9.12.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ matrix.platform }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ matrix.platform }}-ghc-${{ matrix.ghc }}-cabal-

      - name: Build executable
        run: |
          cabal update
          cabal build exe:hach --enable-optimization=2

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="v0.0.0"
          version="${raw_tag#v}"
          bin_path="$(cabal list-bin exe:hach --enable-optimization=2 2>/dev/null || true)"
          if [[ -z "$bin_path" || ! -f "$bin_path" ]]; then
            bin_path="$(find dist-newstyle -type f -name hach | grep -v '\.o$' | head -n 1)"
          fi

          mkdir -p staging
          cp "$bin_path" staging/hach
          cp LICENSE staging/LICENSE
          chmod +x staging/hach
          (cd staging && (command -v sha256sum >/dev/null && sha256sum hach LICENSE > checksums.txt || shasum -a 256 hach LICENSE > checksums.txt))

          archive="hach_${version}_${{ matrix.platform }}.tar.gz"
          tar -czvf "$archive" -C staging hach LICENSE checksums.txt

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            hach_*_${{ matrix.platform }}.tar.gz
            hach_*_${{ matrix.platform }}.tar.gz.sha256

      - name: Verify ARM64 archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          archive="$(find . -maxdepth 1 -name 'hach_*_darwin_arm64.tar.gz' -print -quit)"
          test -n "$archive"
          shasum -a 256 -c "${archive#./}.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          file "$RUNNER_TEMP/hach"
          file "$RUNNER_TEMP/hach" | grep -q arm64
          (cd "$RUNNER_TEMP" && shasum -a 256 -c checksums.txt)
          "$RUNNER_TEMP/hach" --version
